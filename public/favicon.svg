    <rect x="12.5" y="8"  width="7" height="7" rx="1.5" fill="#272321"/>
    <rect x="22.5" y="8"  width="7" height="7" rx="1.5" fill="#f2a618"/>
    <rect x="2.5"  y="17" width="7" height="7" rx="1.5" fill="#272321"/>
    <rect x="12.5" y="17" width="7" height="7" rx="1.5" fill="#5ad664"/>
    <rect x="22.5" y="17" width="7" height="7" rx="1.5" fill="#272321"/>
  </g>
